# 同文风主题（tongwenfeng）的布局补丁：改成 GBoard 的习惯布局。由 gen_tongwenfeng_patch.py 生成，不要手改。
# 文件名必须是 <主题 id>.custom.yaml（主题 id = tongwenfeng.trime），Trime/librime 按这个名字自动套用。
patch:
  style/keyboard_height: 225
  style/keyboard_height_land: 180
  style/enter_labels/default: ic@keyboard_return
  preset_keys/Shift_L/label: ic@arrow_up_bold_outline
  preset_keys/BackSpace/label: ic@backspace_outline
  preset_keys/BackSpace2/label: ic@backspace_outline
  preset_keys/Keyboard_number/label: '?123'
  preset_keys/space/label: English
  preset_keys/space_py:
    repeatable: false
    preview: ' '
    functional: false
    slide_cursor: true
    label: 拼音
    send: space
  preset_keys/Keyboard_emoji: {label: ic@emoticon_happy_outline, functional: false, send: Eisu_toggle, select: bqrw1}
  preset_keys/Keyboard_numpad: {label: '1234', functional: false, send: Eisu_toggle, select: numpad}
  preset_keys/Keyboard_fh: {label: =\<, functional: true, send: Eisu_toggle, select: fh1}
  preset_keys/Keyboard_bqsy1/select: fh1
  preset_keys/Keyboard_bqsy2/select: fhe
  preset_keys/Keyboard_bqfh/select: fh1
  preset_keys/Keyboard_bqrw/select: fh1
  preset_keys/Keyboard_fhp1: {label: 上页, functional: false, send: Eisu_toggle, select: fh1, key_text_size: '14'}
  preset_keys/Keyboard_fhn1: {label: 下页, functional: false, send: Eisu_toggle, select: fh1, key_text_size: '14'}
  preset_keys/Keyboard_fhp2: {label: 上页, functional: false, send: Eisu_toggle, select: fh2, key_text_size: '14'}
  preset_keys/Keyboard_fhn2: {label: 下页, functional: false, send: Eisu_toggle, select: fh2, key_text_size: '14'}
  preset_keys/Keyboard_fhp3: {label: 上页, functional: false, send: Eisu_toggle, select: fh3, key_text_size: '14'}
  preset_keys/Keyboard_fhn3: {label: 下页, functional: false, send: Eisu_toggle, select: fh3, key_text_size: '14'}
  preset_keys/Keyboard_fhp4: {label: 上页, functional: false, send: Eisu_toggle, select: fh4, key_text_size: '14'}
  preset_keys/Keyboard_fhn4: {label: 下页, functional: false, send: Eisu_toggle, select: fh4, key_text_size: '14'}
  preset_keyboards/bqrw1/keys/@26/click: ☺️
  liquid_keyboard/single_width: 34
  liquid_keyboard/margin_x: 2
  liquid_keyboard/key_height: 36
  preset_keys/BackSpace3: {label: 退格, repeatable: true, functional: false, send: BackSpace}
  liquid_keyboard/fixed_key_bar/keys: [liquid_keyboard_exit, space1, BackSpace3, Return2, clipboard_window, liquid_keyboard_tabs]
  preset_keyboards/default/keys:
  - {click: q, long_click: '1', key_back_color: bh1, key_text_color: th1}
  - {click: w, long_click: '2', key_back_color: bh1, key_text_color: th1}
  - {click: e, long_click: '3', key_back_color: bh1, key_text_color: th1}
  - {click: r, long_click: '4', key_back_color: bh1, key_text_color: th1}
  - {click: t, long_click: '5', key_back_color: bh1, key_text_color: th1}
  - {click: y, long_click: '6', key_back_color: bh1, key_text_color: th1}
  - {click: u, long_click: '7', key_back_color: bh1, key_text_color: th1}
  - {click: i, long_click: '8', key_back_color: bh1, key_text_color: th1}
  - {click: o, long_click: '9', key_back_color: bh1, key_text_color: th1}
  - {click: p, long_click: '0', key_back_color: bh1, key_text_color: th1}
  - {width: 5, key_back_color: bh2, key_text_color: th2}
  - {click: a, long_click: select_all, key_back_color: bh2, key_text_color: th2}
  - click: s
    long_click: '@'
    key_back_color: bh2
    key_text_color: th2
  - click: d
    long_click: '#'
    key_back_color: bh2
    key_text_color: th2
  - {click: f, long_click: $, key_back_color: bh2, key_text_color: th2}
  - click: g
    long_click: '%'
    swipe_down: date_time
    key_back_color: bh2
    key_text_color: th2
  - click: h
    long_click: '!'
    swipe_down: +
    key_back_color: bh2
    key_text_color: th2
  - click: j
    long_click: '&'
    swipe_down: '-'
    key_back_color: bh2
    key_text_color: th2
  - click: k
    long_click: '*'
    swipe_down: _
    key_back_color: bh2
    key_text_color: th2
  - {click: l, long_click: '(){Left}', swipe_down: '=', key_back_color: bh2, key_text_color: th2}
  - {width: 5, key_back_color: bh2, key_text_color: th2}
  - {click: Shift_L, long_click: Shift_L, double_click: Shift_L3, composing: delimiter, width: 15, hilited_key_back_color: benter, key_back_color: bbs, key_text_color: tbs}
  - click: z
    long_click: '`'
    swipe_down: '[]{Left}'
    key_back_color: bh3
    key_text_color: th3
  - click: x
    long_click: cut
    swipe_down: '{}{Left}'
    key_back_color: bh3
    key_text_color: th3
  - click: c
    long_click: copy
    swipe_down: ' '
    key_back_color: bh3
    key_text_color: th3
  - {click: v, long_click: paste_clip, swipe_down: paste, key_back_color: bh3, key_text_color: th3}
  - {click: b, long_click: ;, swipe_down: \, key_back_color: bh3, key_text_color: th3}
  - click: n
    long_click: ':'
    key_back_color: bh3
    key_text_color: th3
  - click: m
    long_click: '?'
    swipe_down: '|'
    key_back_color: bh3
    key_text_color: th3
  - {click: BackSpace2, width: 15, key_back_color: bbs, key_text_color: tbs}
  - click: Keyboard_number
    long_click: '{hide_key_symbol}{hide_key_hint}'
    width: 15
    key_back_color: bgn
    key_text_color: tgn
  - click: ','
    label: ，
    long_click: <>{Left}
    width: 10
    key_back_color: bh4
    key_text_color: th4
  - {click: Keyboard_emoji, long_click: liquid_keyboard_switch, width: 10, key_back_color: bh4, key_text_color: th4}
  - {click: space, label: 拼音, long_click: Mode_switch, swipe_left: Left, swipe_right: Right, swipe_up: Schema_switchcn, width: 40, key_text_size: '16', key_back_color: bkg, key_text_color: tkg}
  - {click: ., label: 。, long_click: clipboard_window, width: 10, key_back_color: bh4, key_text_color: th4}
  - click: Return
    label_symbol: wiki
    popup: [TrimeWiki, Settings]
    composing: Return1
    swipe_up: Escape
    width: 15
    key_back_color: benter
    key_text_color: tenter
