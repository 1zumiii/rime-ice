# 个人通用补丁

patch:
  # 旧配置里去掉了 emoji：emoji 开关每次都回到方案默认状态（rime_ice 里 reset: 1）
  switcher/save_options:
    - ascii_punct
    - traditionalization
    - full_shape
    - search_single_char

  # 每页候选个数（Rime 不支持根据内容动态调整，只能固定；7 个时短词容易顶到第二行，所以用 5）
  menu/page_size: 5


  # 只保留在用的方案（全拼 rime_ice）。九宫格和各种双拼的方案文件已从本仓库删除，
  # 需要时从上游（iDvel/rime-ice）拿回对应的 *.schema.yaml，再把方案加回这里。
  schema_list:
    - schema: rime_ice
